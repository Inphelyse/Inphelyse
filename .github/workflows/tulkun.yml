name: Update Tulkun

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  tulkun:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Tulkun
        uses: PramudithaN/git-tulkun@v1
        
      - name: Commit and Push Tulkun
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tulkun.gif tulkun.png share-card.png || true
          git diff --cached --quiet || git commit -m "chore: update git-tulkun animation"
          git push || true
